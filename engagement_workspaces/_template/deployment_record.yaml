# Engagement-side deployment record. Mirrors the canonical record in
# deployments/<engagement_code>.yaml. Updated in the same commit when
# deployment metadata changes.
#
# Why both: the deployments/ directory is the single source of truth
# read by anyone navigating the practice. The workspace mirror lives
# alongside the engagement's other working documents so a consultant
# preparing for a quarterly review or reading engagement context
# does not have to context-switch to deployments/.
#
# When these two files disagree, the deployments/ version is canonical
# and this file is stale. Update both.

